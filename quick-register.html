
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ShadowBridge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="docs/legacy-support.css">
</head>
<body class="legacy-form-page">
    <noscript><p class="legacy-notice">Registration is unavailable. These preserved forms require JavaScript for local preview checks; they cannot create an account.</p></noscript>
    <section class="register-section">
        <div class="form-container">
            <h2>Join ShadowBridge Network</h2>
            <form id="quickRegistrationForm">
                <label for="name">Full Name*</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email*</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number (optional)</label>
                <input type="tel" id="phone" name="phone">

                <label for="country">Country*</label>
                <input type="text" id="country" name="country" required>

                <label for="strengths">What are you good at?*</label>
                <textarea id="strengths" name="strengths" rows="3" required></textarea>

                <label for="resourcefulness">Can you find gold in the noise — and convince the right people to move when it matters?*</label>
                <textarea id="resourcefulness" name="resourcefulness" rows="3" required></textarea>

                <label for="mutual-value">What can you offer ShadowBridge — and what do you expect us to offer in return?*</label>
                <textarea id="mutual-value" name="mutual-value" rows="4" required></textarea>

                <button type="submit" disabled class="cta-button">Join Now</button>
            </form>
        </div>
    </section>

    <script src="docs/legacy-support.js"></script>
    <script>
        document.getElementById('quickRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.ShadowBridgeLegacy.notify();
            // Backend submission remains disabled until real authentication and persistence are approved and tested.
        });
    </script>
</body>
</html>
